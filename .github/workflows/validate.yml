name: Validate Malta Trip Guide

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JSON, schema, page wiring, and local links
        run: python3 scripts/validate_site.py
      - name: Check JavaScript syntax
        run: |
          node --check js/site.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.external = any(key == "src" for key, _ in attrs)
                      self.current = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.current))
                      self.in_script = False
                      self.external = False
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          for html_path in Path(".").glob("*.html"):
              parser = InlineScripts()
              parser.feed(html_path.read_text(encoding="utf-8"))
              for script in parser.scripts:
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as temp:
                      temp.write(script)
                      temp.flush()
                      subprocess.run(["node", "--check", temp.name], check=True)
          PY
